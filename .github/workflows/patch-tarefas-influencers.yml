name: Patch tarefas influencers

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/patch-tarefas-influencers.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Apply changes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/pages/TarefasInfluencersOrganizadas.js')
          text = path.read_text(encoding='utf-8')

          replacements = []

          replacements.append((
              "  const [salvando, setSalvando] = useState(false)\n  const [form, setForm] = useState({ modelo_id:'', parceiro_id:'', livro_id:'', responsavel_ids:[], data_prazo:'', observacao:'' })",
              "  const [salvando, setSalvando] = useState(false)\n  const [buscaLivro, setBuscaLivro] = useState('')\n  const [form, setForm] = useState({ modelo_id:'', parceiro_id:'', livro_id:'', responsavel_ids:[], data_prazo:'', observacao:'' })"
          ))

          replacements.append((
              "  const livro = livros.find(l => l.id === form.livro_id)\n  const etapas =",
              "  const livro = livros.find(l => l.id === form.livro_id)\n  const livrosFiltrados = useMemo(() => {\n    const termo = buscaLivro.trim().toLowerCase()\n    if (!termo) return livros\n    return livros.filter(l => `${l.titulo || ''} ${l.autor || ''} ${l.isbn || ''}`.toLowerCase().includes(termo))\n  }, [livros, buscaLivro])\n  const etapas ="
          ))

          replacements.append((
              "    if (!form.livro_id) return alert('Selecione o livro relacionado.')\n",
              ""
          ))

          replacements.append((
              "      const identificacao = `${livro.titulo}${livro.autor ? ` — ${livro.autor}` : ''}${livro.isbn ? ` · ISBN ${livro.isbn}` : ''}`",
              "      const identificacao = livro ? `${livro.titulo}${livro.autor ? ` — ${livro.autor}` : ''}${livro.isbn ? ` · ISBN ${livro.isbn}` : ''}` : ''"
          ))

          replacements.append((
              "        especificidade:[`Livro: ${identificacao}`, form.observacao.trim()].filter(Boolean).join('\\n'),",
              "        especificidade:[identificacao ? `Livro: ${identificacao}` : '', form.observacao.trim()].filter(Boolean).join('\\n'),"
          ))

          old_new_book = "<div className=\"form-group\"><label className=\"form-label\">3. Livro relacionado *</label><select className=\"form-select\" value={form.livro_id} onChange={e => setForm(f => ({ ...f, livro_id:e.target.value }))}><option value=\"\">Selecione</option>{livros.map(l => <option key={l.id} value={l.id}>{l.titulo}{l.autor ? ` — ${l.autor}` : ''}</option>)}</select></div>"
          new_new_book = "<div className=\"form-group\"><label className=\"form-label\">3. Livro relacionado (opcional)</label><input className=\"form-input\" placeholder=\"Buscar por título, autor ou ISBN...\" value={buscaLivro} onChange={e => setBuscaLivro(e.target.value)}/><select className=\"form-select\" style={{ marginTop:6 }} value={form.livro_id} onChange={e => setForm(f => ({ ...f, livro_id:e.target.value }))}><option value=\"\">Sem livro relacionado</option>{livrosFiltrados.map(l => <option key={l.id} value={l.id}>{l.titulo}{l.autor ? ` — ${l.autor}` : ''}{l.isbn ? ` · ISBN ${l.isbn}` : ''}</option>)}</select></div>"
          replacements.append((old_new_book, new_new_book))

          replacements.append((
              "  const [salvando, setSalvando] = useState(false)\n  const [form, setForm] = useState({ titulo:tarefa.banco_tarefa?.nome || tarefa.titulo || '', parceiro_id:tarefa.parceiro?.id || '', livro_id:livroAtual?.id || '', responsavel_ids:responsaveisDa(tarefa).map(r => r.id), data_prazo:tarefa.data_prazo || '', status:tarefa.status || 'a_fazer', observacao:detalhes.observacao || '' })",
              "  const [salvando, setSalvando] = useState(false)\n  const [buscaLivro, setBuscaLivro] = useState('')\n  const [form, setForm] = useState({ titulo:tarefa.banco_tarefa?.nome || tarefa.titulo || '', parceiro_id:tarefa.parceiro?.id || '', livro_id:livroAtual?.id || '', responsavel_ids:responsaveisDa(tarefa).map(r => r.id), data_prazo:tarefa.data_prazo || '', status:tarefa.status || 'a_fazer', observacao:detalhes.observacao || '' })\n  const livrosFiltrados = useMemo(() => {\n    const termo = buscaLivro.trim().toLowerCase()\n    if (!termo) return livros\n    return livros.filter(l => `${l.titulo || ''} ${l.autor || ''} ${l.isbn || ''}`.toLowerCase().includes(termo))\n  }, [livros, buscaLivro])"
          ))

          replacements.append((
              "        const identificacao = livro ? `${livro.titulo}${livro.autor ? ` — ${livro.autor}` : ''}${livro.isbn ? ` · ISBN ${livro.isbn}` : ''}` : detalhes.livro",
              "        const identificacao = livro ? `${livro.titulo}${livro.autor ? ` — ${livro.autor}` : ''}${livro.isbn ? ` · ISBN ${livro.isbn}` : ''}` : ''"
          ))

          old_edit_book = "<div className=\"form-group\"><label className=\"form-label\">Livro relacionado</label><select className=\"form-select\" value={form.livro_id} onChange={e => setForm(f => ({ ...f, livro_id:e.target.value }))}><option value=\"\">Manter livro atual</option>{livros.map(l => <option key={l.id} value={l.id}>{l.titulo}{l.autor ? ` — ${l.autor}` : ''}</option>)}</select></div>"
          new_edit_book = "<div className=\"form-group\"><label className=\"form-label\">Livro relacionado (opcional)</label><input className=\"form-input\" placeholder=\"Buscar por título, autor ou ISBN...\" value={buscaLivro} onChange={e => setBuscaLivro(e.target.value)}/><select className=\"form-select\" style={{ marginTop:6 }} value={form.livro_id} onChange={e => setForm(f => ({ ...f, livro_id:e.target.value }))}><option value=\"\">Sem livro relacionado</option>{livrosFiltrados.map(l => <option key={l.id} value={l.id}>{l.titulo}{l.autor ? ` — ${l.autor}` : ''}{l.isbn ? ` · ISBN ${l.isbn}` : ''}</option>)}</select></div>"
          replacements.append((old_edit_book, new_edit_book))

          replacements.append((
              "  const podeCriar = isAdmin || usuario?.perfil === 'estagiario_influencers'",
              "  const podeCriar = isAdmin || INFLUENCER_PERFIS.includes(usuario?.perfil)"
          ))

          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f'Trecho não encontrado para substituição: {old[:120]}')
              text = text.replace(old, new, 1)

          path.write_text(text, encoding='utf-8')
          PY

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build
        run: npm run build

      - name: Commit changes
        shell: bash
        run: |
          rm .github/workflows/patch-tarefas-influencers.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/TarefasInfluencersOrganizadas.js .github/workflows/patch-tarefas-influencers.yml
          git commit -m "Corrige tarefas de influencers e busca de livros"
          git push origin main
