name: Agrupar modulos duplicados do administrador

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/agrupar-campanhas-admin.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Agrupar Campanhas no menu administrador
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/App.js')
          s = p.read_text(encoding='utf-8')
          if "key: 'campanhas'" not in s:
              alvo = """  {\n    key: 'monitoramento', label: 'Monitoramento', icon: Eye,\n"""
              bloco = """  {\n    key: 'campanhas', label: 'Campanhas', icon: Megaphone,\n    items: [\n      { path: '/campanhas', label: 'Influencers' },\n      { path: '/promocoes-parceiras', label: 'Editoras Parceiras / Promoções' },\n    ],\n  },\n"""
              if alvo not in s:
                  raise SystemExit('Ponto de insercao de Campanhas nao encontrado')
              s = s.replace(alvo, bloco + alvo, 1)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Verificar agrupamentos
        run: |
          grep -q "key: 'dashboard'" src/App.js
          grep -q "key: 'crm'" src/App.js
          grep -q "key: 'campanhas'" src/App.js
          grep -q "key: 'monitoramento'" src/App.js
          grep -q "key: 'tarefas'" src/App.js
          grep -q "key: 'rh'" src/App.js
          grep -q "key: 'pda'" src/App.js
          grep -q "key: 'treinamentos'" src/App.js

      - name: Instalar dependencias
        run: npm install --no-audit --no-fund

      - name: Validar build
        run: npm run build

      - name: Publicar na main
        run: |
          rm .github/workflows/agrupar-campanhas-admin.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.js .github/workflows/agrupar-campanhas-admin.yml
          git commit -m "feat: agrupa modulos duplicados no menu admin"
          git push origin main
