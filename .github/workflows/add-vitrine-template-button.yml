name: Apply Vitrine cycle patch

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Apply patch
        run: |
          echo '' | base64 -d > /tmp/patch_vitrine.py
          python3 /tmp/patch_vitrine.py

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Commit
        run: |
          rm -f .github/workflows/add-vitrine-template-button.yml
          rm -f .github/workflows/apply-vitrine-cycle-patch.yml
          rm -f .github/workflows/patch-vitrine-novo-ciclo.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/VitrinePublica.js src/pages/VitrineAdmin.js .github/workflows
          git commit -m "Permite liberar novo ciclo individual na Vitrine [vitrine-novo-ciclo-done]"
          git push origin main
