name: Combobox livros tarefas influencers

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/combobox-livros-tarefas.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Aplicar campo pesquisável com sugestões
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/pages/TarefasInfluencersOrganizadas.js')
          text = path.read_text(encoding='utf-8')

          old_new = '''<div className="form-group"><label className="form-label">3. Livro relacionado (opcional)</label><input className="form-input" placeholder="Buscar por título, autor ou ISBN..." value={buscaLivro} onChange={e => setBuscaLivro(e.target.value)}/><select className="form-select" style={{ marginTop:6 }} value={form.livro_id} onChange={e => setForm(f => ({ ...f, livro_id:e.target.value }))}><option value="">Sem livro relacionado</option>{livrosFiltrados.map(l => <option key={l.id} value={l.id}>{l.titulo}{l.autor ? ` — ${l.autor}` : ''}{l.isbn ? ` · ISBN ${l.isbn}` : ''}</option>)}</select></div>'''
          new_new = '''<div className="form-group"><label className="form-label">3. Livro relacionado (opcional)</label><input className="form-input" placeholder="Buscar por título, autor ou ISBN..." value={buscaLivro} onChange={e => { setBuscaLivro(e.target.value); setForm(f => ({ ...f, livro_id:'' })) }}/>{buscaLivro.trim() && <div style={{ marginTop:6, border:'1px solid var(--border)', borderRadius:8, maxHeight:220, overflowY:'auto', background:'var(--surface)' }}>{livrosFiltrados.slice(0,30).map(l => <button key={l.id} type="button" onClick={() => { setForm(f => ({ ...f, livro_id:l.id })); setBuscaLivro(`${l.titulo}${l.autor ? ` — ${l.autor}` : ''}${l.isbn ? ` · ISBN ${l.isbn}` : ''}`) }} style={{ width:'100%', textAlign:'left', padding:'9px 11px', border:'none', borderBottom:'1px solid var(--border)', background:form.livro_id === l.id ? 'var(--accent-glow)' : 'transparent', color:'var(--text)', cursor:'pointer' }}><strong>{l.titulo}</strong>{l.autor ? <span> — {l.autor}</span> : null}{l.isbn ? <span style={{ color:'var(--text-muted)' }}> · ISBN {l.isbn}</span> : null}</button>)}{livrosFiltrados.length === 0 && <div style={{ padding:10, fontSize:12, color:'var(--text-muted)' }}>Nenhum livro encontrado.</div>}</div>}{form.livro_id && <div style={{ marginTop:6, fontSize:11, color:'var(--accent)' }}>Livro selecionado.</div>}</div>'''

          old_edit = '''<div className="form-group"><label className="form-label">Livro relacionado (opcional)</label><input className="form-input" placeholder="Buscar por título, autor ou ISBN..." value={buscaLivro} onChange={e => setBuscaLivro(e.target.value)}/><select className="form-select" style={{ marginTop:6 }} value={form.livro_id} onChange={e => setForm(f => ({ ...f, livro_id:e.target.value }))}><option value="">Sem livro relacionado</option>{livrosFiltrados.map(l => <option key={l.id} value={l.id}>{l.titulo}{l.autor ? ` — ${l.autor}` : ''}{l.isbn ? ` · ISBN ${l.isbn}` : ''}</option>)}</select></div>'''
          new_edit = '''<div className="form-group"><label className="form-label">Livro relacionado (opcional)</label><input className="form-input" placeholder="Buscar por título, autor ou ISBN..." value={buscaLivro} onChange={e => { setBuscaLivro(e.target.value); setForm(f => ({ ...f, livro_id:'' })) }}/>{buscaLivro.trim() && <div style={{ marginTop:6, border:'1px solid var(--border)', borderRadius:8, maxHeight:220, overflowY:'auto', background:'var(--surface)' }}>{livrosFiltrados.slice(0,30).map(l => <button key={l.id} type="button" onClick={() => { setForm(f => ({ ...f, livro_id:l.id })); setBuscaLivro(`${l.titulo}${l.autor ? ` — ${l.autor}` : ''}${l.isbn ? ` · ISBN ${l.isbn}` : ''}`) }} style={{ width:'100%', textAlign:'left', padding:'9px 11px', border:'none', borderBottom:'1px solid var(--border)', background:form.livro_id === l.id ? 'var(--accent-glow)' : 'transparent', color:'var(--text)', cursor:'pointer' }}><strong>{l.titulo}</strong>{l.autor ? <span> — {l.autor}</span> : null}{l.isbn ? <span style={{ color:'var(--text-muted)' }}> · ISBN {l.isbn}</span> : null}</button>)}{livrosFiltrados.length === 0 && <div style={{ padding:10, fontSize:12, color:'var(--text-muted)' }}>Nenhum livro encontrado.</div>}</div>}{form.livro_id && <div style={{ marginTop:6, fontSize:11, color:'var(--accent)' }}>Livro selecionado.</div>}</div>'''

          if old_new not in text:
              raise SystemExit('Campo de livro da nova tarefa não encontrado')
          if old_edit not in text:
              raise SystemExit('Campo de livro da edição não encontrado')

          text = text.replace(old_new, new_new, 1)
          text = text.replace(old_edit, new_edit, 1)
          path.write_text(text, encoding='utf-8')
          PY

      - name: Instalar dependências
        run: npm install --no-audit --no-fund

      - name: Validar build
        run: npm run build

      - name: Publicar alteração
        run: |
          rm .github/workflows/combobox-livros-tarefas.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/TarefasInfluencersOrganizadas.js .github/workflows/combobox-livros-tarefas.yml
          git commit -m "Melhora seleção pesquisável de livros nas tarefas"
          git push origin main
