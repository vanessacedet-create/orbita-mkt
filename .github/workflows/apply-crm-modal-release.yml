name: Apply CRM modal release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch-crm-branch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/melhorar-modal-crm-influencers
          fetch-depth: 0
      - name: Apply CRM modal improvements
        shell: python
        run: |
          from pathlib import Path
          import re

          crm_path = Path('src/pages/CRM.js')
          crm = crm_path.read_text(encoding='utf-8')

          old_extractor = '''// ── Extrai o username do Instagram a partir da URL do perfil ──
          function extrairUsername(profileUrl, usernameFallback) {
            let user = ''
            try {
              const url = profileUrl || ''
              if (url.includes('instagram')) {
                user = new URL(url.startsWith('http') ? url : 'https://' + url).pathname.replace(/\\//g, '')
              }
            } catch {}
            if (!user) user = (usernameFallback || '').replace('@', '')
            return user
          }
          '''.replace('          ', '')
          new_extractor = '''// ── Extrai o username a partir da URL do perfil ──
          function extrairUsername(profileUrl, usernameFallback) {
            let user = ''
            try {
              const raw = (profileUrl || '').trim()
              if (raw) {
                const url = new URL(raw.startsWith('http') ? raw : `https://${raw}`)
                const partes = url.pathname.split('/').filter(Boolean)
                user = (partes[0] || '').replace('@', '')
              }
            } catch {}
            if (!user) user = (usernameFallback || '').replace('@', '').trim()
            return user
          }

          function getSocialCatUrl({ profileUrl, username, platforms = [] }) {
            const perfil = (profileUrl || '').toLowerCase()
            const ehTikTok = platforms.includes('TikTok') || perfil.includes('tiktok.com')
            const ehInstagram = platforms.includes('Instagram') || perfil.includes('instagram.com')
            const base = ehTikTok
              ? 'https://thesocialcat.com/tools/tiktok-engagement-rate-calculator'
              : 'https://thesocialcat.com/tools/instagram-engagement-rate-calculator'
            const user = extrairUsername(profileUrl, username)
            return {
              url: user ? `${base}?username=${encodeURIComponent(user)}` : base,
              plataformaSuportada: ehTikTok || ehInstagram,
              plataforma: ehTikTok ? 'TikTok' : 'Instagram',
            }
          }
          '''.replace('          ', '')
          if old_extractor in crm:
            crm = crm.replace(old_extractor, new_extractor, 1)

          state_marker = "  const [motivoEncerrar, setMotivoEncerrar] = useState('')\n"
          if 'const [alteracoesPendentes' not in crm:
            dirty_block = '''  const [motivoEncerrar, setMotivoEncerrar] = useState('')
            const [alteracoesPendentes, setAlteracoesPendentes] = useState(false)

            useEffect(() => {
              const original = {
                nome: inicial.nome||'', username: inicial.username||'', platforms: inicial.platforms||[],
                followers: inicial.followers_count || {}, engagement_rate: inicial.engagement_rate||'',
                profile_url: inicial.profile_url||'', contact_value: inicial.contact_value||'',
                source: inicial.source||'', referred_by: inicial.referred_by||'', library_url: inicial.library_url||'',
                coupon_code: inicial.coupon_code||'', model: inicial.model||'',
                responsavel_interno_id: inicial.responsavel_interno_id||'',
                editoras_sugeridas: inicial.editoras_sugeridas ? String(inicial.editoras_sugeridas).split(',').map(e=>e.trim()).filter(Boolean) : [],
              }
              const livrosOriginais = (inicial.livros_propostos||[]).map(lp=>({id:lp.livro_id, titulo:lp.livro, autor:''}))
              setAlteracoesPendentes(JSON.stringify(form) !== JSON.stringify(original) || JSON.stringify(livrosConvidados) !== JSON.stringify(livrosOriginais))
            }, [form, livrosConvidados, inicial])

            function fecharModal() {
              if (alteracoesPendentes && !window.confirm('Há alterações não salvas. Deseja fechar mesmo assim?')) return
              onClose()
            }
          '''.replace('            ', '')
            crm = crm.replace(state_marker, dirty_block, 1)

          crm = crm.replace("      showToast('Perfil atualizado!')\n    } catch(e) { showToast('Erro ao salvar','error') } finally { setSaving(false) }", "      setAlteracoesPendentes(false)\n      showToast('Perfil atualizado!')\n    } catch(e) {\n      console.error('Erro ao salvar perfil CRM:', e)\n      showToast(`Erro ao salvar: ${e?.message || 'verifique os dados informados'}`, 'error')\n    } finally { setSaving(false) }", 1)

          crm = crm.replace('onClick={onClose}><X size={16}/></button>', 'onClick={fecharModal}><X size={16}/></button>', 1)
          crm = crm.replace("{v:'livros_propostos',l:`Livros propostos (${(parceiro.livros_propostos||[]).length})`}", "{v:'livros_propostos',l:`Livros propostos (${livrosConvidados.length})`}", 1)

          pattern = re.compile(r"onClick=\{\(\)=>\{\s*const user = extrairUsername\(form\.profile_url, form\.username\)\s*const dest = user\s*\? `https://thesocialcat\.com/tools/instagram-engagement-rate-calculator\?username=\$\{encodeURIComponent\(user\)\}`\s*: 'https://thesocialcat\.com/tools/instagram-engagement-rate-calculator'\s*window\.open\(dest, '_blank'\)\s*\}\}")
          replacement = """onClick={()=>{
                    const socialCat = getSocialCatUrl({ profileUrl: form.profile_url, username: form.username, platforms: form.platforms })
                    window.open(socialCat.url, '_blank', 'noopener,noreferrer')
                  }}"""
          crm = pattern.sub(replacement, crm)

          hint_pattern = re.compile(r"\{!\(form\.profile_url \|\| ''\)\.includes\('instagram'\) && !form\.engagement_rate && \(\s*<div style=\{\{fontSize:10,color:'var\(--text-muted\)',marginTop:3\}\}>\s*Preencha o link do Instagram acima para calcular automaticamente\s*</div>\s*\)\}")
          hint_replacement = """{!form.engagement_rate && (
                  <div style={{fontSize:10,color:'var(--text-muted)',marginTop:3}}>
                    O botão abre o The Social Cat na calculadora de Instagram ou TikTok conforme o perfil selecionado.
                  </div>
                )}"""
          crm = hint_pattern.sub(hint_replacement, crm)

          footer_marker = """            <div style={{display:'flex',justifyContent:'flex-end',position:'sticky',bottom:0,paddingTop:12,paddingBottom:4,background:'var(--surface)',borderTop:'1px solid var(--border)',marginTop:8}}>
              <button className="btn btn-primary" onClick={salvarPerfil} disabled={saving}>"""
          if 'Abrir calculadora de proposta' not in crm and footer_marker in crm:
            proposal = """            {form.model==='3' ? (
              <div style={{padding:'14px 16px',borderRadius:10,background:'rgba(59,130,246,0.08)',border:'1px solid rgba(59,130,246,0.3)',marginTop:8}}>
                <div style={{fontSize:13,fontWeight:700,color:'var(--text)',marginBottom:5}}>Proposta institucional</div>
                <div style={{fontSize:12,color:'var(--text-muted)',marginBottom:10}}>Gere três opções personalizadas de proposta para este creator.</div>
                <button type="button" className="btn btn-primary" onClick={()=>{
                  const seguidores = Object.values(form.followers || {}).reduce((total, valor)=>total + (Number(valor)||0), 0)
                  const params = new URLSearchParams({ nome: form.nome || '', arroba: form.username || '', plataforma: form.platforms?.[0] || '', seguidores: String(seguidores || ''), engajamento: String(form.engagement_rate || '') })
                  window.open(`/calculadora-influenciadores?${params.toString()}`, '_blank', 'noopener,noreferrer')
                }}>Abrir calculadora de proposta</button>
              </div>
            ) : form.model ? (
              <div style={{padding:'11px 14px',borderRadius:8,background:'var(--surface-2)',border:'1px solid var(--border)',fontSize:12,color:'var(--text-muted)',marginTop:8}}>
                Este modelo já utiliza remuneração por comissão sobre vendas. Não é necessário calcular cachê.
              </div>
            ) : null}

            <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',gap:12,position:'sticky',bottom:0,paddingTop:12,paddingBottom:4,background:'var(--surface)',borderTop:'1px solid var(--border)',marginTop:8}}>
              <span style={{fontSize:11,color:alteracoesPendentes?'#f59e0b':'var(--text-muted)'}}>{alteracoesPendentes ? 'Alterações não salvas' : 'Tudo salvo'}</span>
              <button className="btn btn-primary" onClick={salvarPerfil} disabled={saving}>"""
            crm = crm.replace(footer_marker, proposal, 1)

          crm_path.write_text(crm, encoding='utf-8')

          app_path = Path('src/App.js')
          app = app_path.read_text(encoding='utf-8')
          lazy_line = "const CalculadoraInfluenciadores = lazy(() => import('./pages/CalculadoraInfluenciadores'))"
          if lazy_line not in app:
            app = app.replace("const Calculadora            = lazy(() => import('./pages/Calculadora'))", "const Calculadora            = lazy(() => import('./pages/Calculadora'))\n" + lazy_line, 1)
          menu_line = "  { path: '/calculadora-influenciadores', label: 'Calculadora Influencers', icon: Calculator, modulo: 'calculadora_influenciadores', ocultarPerfis: PERFIS_PARCEIRAS },"
          if menu_line not in app:
            app = app.replace("  { path: '/crm-influencers',       label: 'CRM Influencers',    icon: Network,         modulo: 'crm_influencers',   ocultarPerfis: PERFIS_PARCEIRAS },", "  { path: '/crm-influencers',       label: 'CRM Influencers',    icon: Network,         modulo: 'crm_influencers',   ocultarPerfis: PERFIS_PARCEIRAS },\n" + menu_line, 1)
          route_line = '                <Route path="/calculadora-influenciadores" element={<RequireAuth modulo="calculadora_influenciadores"><CalculadoraInfluenciadores /></RequireAuth>} />'
          if route_line not in app:
            app = app.replace('                <Route path="/crm-influencers" element={<RequireAuth modulo="crm_influencers"><CRM grupo="influencers" titulo="CRM Influencers" /></RequireAuth>} />', '                <Route path="/crm-influencers" element={<RequireAuth modulo="crm_influencers"><CRM grupo="influencers" titulo="CRM Influencers" /></RequireAuth>} />\n' + route_line, 1)
          app_path.write_text(app, encoding='utf-8')

          calc_path = Path('src/pages/CalculadoraInfluenciadores.js')
          if calc_path.exists():
            calc = calc_path.read_text(encoding='utf-8')
            if 'new URLSearchParams(window.location.search)' not in calc:
              calc = calc.replace("export default function CalculadoraInfluenciadores() {\n  const [form, setForm] = useState(initial)", "export default function CalculadoraInfluenciadores() {\n  const params = new URLSearchParams(window.location.search)\n  const [form, setForm] = useState(() => ({\n    ...initial,\n    nome: params.get('nome') || '',\n    arroba: params.get('arroba') || '',\n    plataforma: params.get('plataforma') || 'Instagram',\n    seguidores: params.get('seguidores') || '',\n    engajamento_socialcat: params.get('engajamento') || '',\n  }))", 1)
              calc_path.write_text(calc, encoding='utf-8')
      - name: Commit branch changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/CRM.js src/App.js src/pages/CalculadoraInfluenciadores.js
          git diff --cached --quiet && exit 0
          git commit -m "Melhorar modal do CRM de influencers"
          git push origin agent/melhorar-modal-crm-influencers
