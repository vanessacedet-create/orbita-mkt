name: Aplicar livraria e remover Anny

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/aplica-livraria-e-remove-anny.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Aplicar alterações
        run: python3 scripts/apply_partner_library_cleanup.py

      - name: Instalar dependências
        run: npm install --no-audit --no-fund

      - name: Validar build
        run: npm run build

      - name: Publicar
        run: |
          rm .github/workflows/aplica-livraria-e-remove-anny.yml
          rm scripts/apply_partner_library_cleanup.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/CRM.js src/pages/TarefasInfluencersOrganizadas.js src/lib/banco-tarefas.js .github/workflows/aplica-livraria-e-remove-anny.yml scripts/apply_partner_library_cleanup.py
          git commit -m "Centraliza nome da livraria e remove Anny das tarefas abertas"
          git push origin main
