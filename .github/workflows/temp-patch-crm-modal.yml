name: Temporary CRM patch

on:
  push:
    branches: [main]
    paths: ['.github/workflows/temp-patch-crm-modal.yml']

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/melhorar-modal-crm-influencers
          fetch-depth: 0
      - name: Apply CRM improvements
        shell: python
        run: |
          from pathlib import Path
          crm_path = Path('src/pages/CRM.js')
          crm = crm_path.read_text(encoding='utf-8')
          old_calc = """const user = extrairUsername(form.profile_url, form.username)
                      const dest = user
                        ? `https://thesocialcat.com/tools/instagram-engagement-rate-calculator?username=${encodeURIComponent(user)}`
                        : 'https://thesocialcat.com/tools/instagram-engagement-rate-calculator'
                      window.open(dest, '_blank')"""
          new_calc = """const user = extrairUsername(form.profile_url, form.username)
                      const ehTikTok = form.platforms.includes('TikTok') || (form.profile_url || '').toLowerCase().includes('tiktok')
                      const base = ehTikTok
                        ? 'https://thesocialcat.com/tools/tiktok-engagement-rate-calculator'
                        : 'https://thesocialcat.com/tools/instagram-engagement-rate-calculator'
                      const dest = user ? `${base}?username=${encodeURIComponent(user)}` : base
                      window.open(dest, '_blank', 'noopener,noreferrer')"""
          if old_calc not in crm: raise SystemExit('Bloco The Social Cat não encontrado')
          crm = crm.replace(old_calc, new_calc, 1)
          crm = crm.replace("{v:'livros_propostos',l:`Livros propostos (${(parceiro.livros_propostos||[]).length})`}", "{v:'livros_propostos',l:`Livros propostos (${livrosConvidados.length})`}", 1)
          crm = crm.replace("} catch(e) { showToast('Erro ao salvar','error') } finally { setSaving(false) }", "} catch(e) { console.error('Erro ao salvar perfil CRM:', e); showToast(`Erro ao salvar: ${e?.message || 'verifique os dados informados'}`,'error') } finally { setSaving(false) }", 1)
          marker = """            <div style={{display:'flex',justifyContent:'flex-end',position:'sticky',bottom:0,paddingTop:12,paddingBottom:4,background:'var(--surface)',borderTop:'1px solid var(--border)',marginTop:8}}>
              <button className="btn btn-primary" onClick={salvarPerfil} disabled={saving}>"""
          block = """            {form.model==='3' ? (
              <div style={{padding:'14px 16px',borderRadius:10,background:'rgba(59,130,246,0.08)',border:'1px solid rgba(59,130,246,0.3)',marginTop:8}}>
                <div style={{fontSize:13,fontWeight:700,color:'var(--text)',marginBottom:5}}>Proposta institucional</div>
                <div style={{fontSize:12,color:'var(--text-muted)',marginBottom:10}}>Use a calculadora para gerar três opções personalizadas de proposta para este creator.</div>
                <button type="button" className="btn btn-primary" onClick={()=>{
                  const seguidores = Object.values(form.followers || {}).reduce((total, valor)=>total + (Number(valor)||0), 0)
                  const params = new URLSearchParams({ nome: form.nome || '', arroba: form.username || '', plataforma: form.platforms?.[0] || '', seguidores: String(seguidores || ''), engajamento: String(form.engagement_rate || '') })
                  window.open(`/calculadora-influenciadores?${params.toString()}`, '_blank', 'noopener,noreferrer')
                }}>Abrir calculadora de proposta</button>
              </div>
            ) : form.model ? (
              <div style={{padding:'11px 14px',borderRadius:8,background:'var(--surface-2)',border:'1px solid var(--border)',fontSize:12,color:'var(--text-muted)',marginTop:8}}>
                Este modelo já utiliza remuneração por comissão sobre vendas; não é necessário calcular cachê.
              </div>
            ) : null}

""" + marker
          if marker not in crm: raise SystemExit('Rodapé não encontrado')
          crm = crm.replace(marker, block, 1)
          crm_path.write_text(crm, encoding='utf-8')

          app_path = Path('src/App.js')
          app = app_path.read_text(encoding='utf-8')
          lazy_line = "const CalculadoraInfluenciadores = lazy(() => import('./pages/CalculadoraInfluenciadores'))"
          if lazy_line not in app: app = app.replace("const Calculadora            = lazy(() => import('./pages/Calculadora'))", "const Calculadora            = lazy(() => import('./pages/Calculadora'))\n" + lazy_line, 1)
          menu_line = "  { path: '/calculadora-influenciadores', label: 'Calculadora Influencers', icon: Calculator, modulo: 'calculadora_influenciadores', ocultarPerfis: PERFIS_PARCEIRAS },"
          if menu_line not in app: app = app.replace("  { path: '/crm-influencers',       label: 'CRM Influencers',    icon: Network,         modulo: 'crm_influencers',   ocultarPerfis: PERFIS_PARCEIRAS },", "  { path: '/crm-influencers',       label: 'CRM Influencers',    icon: Network,         modulo: 'crm_influencers',   ocultarPerfis: PERFIS_PARCEIRAS },\n" + menu_line, 1)
          route_line = '                <Route path="/calculadora-influenciadores" element={<RequireAuth modulo="calculadora_influenciadores"><CalculadoraInfluenciadores /></RequireAuth>} />'
          if route_line not in app: app = app.replace('                <Route path="/crm-influencers" element={<RequireAuth modulo="crm_influencers"><CRM grupo="influencers" titulo="CRM Influencers" /></RequireAuth>} />', '                <Route path="/crm-influencers" element={<RequireAuth modulo="crm_influencers"><CRM grupo="influencers" titulo="CRM Influencers" /></RequireAuth>} />\n' + route_line, 1)
          app_path.write_text(app, encoding='utf-8')
      - name: Commit to feature branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/CRM.js src/App.js
          git commit -m "Aplicar melhorias no modal CRM de influencers"
          git push origin HEAD:agent/melhorar-modal-crm-influencers
