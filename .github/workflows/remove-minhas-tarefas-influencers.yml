name: Remove aba Minhas tarefas influencers

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/remove-minhas-tarefas-influencers.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Remover aba Minhas tarefas
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/pages/TarefasInfluencersOrganizadas.js')
          text = path.read_text(encoding='utf-8')

          text = text.replace("  const [aba, setAba] = useState('minhas')\n", "")
          text = text.replace("  const minhas = useMemo(() => tarefas.filter(t => responsaveisDa(t).some(r => r.id === usuario?.id)), [tarefas, usuario?.id])\n  const base = aba === 'equipe' ? tarefas : minhas\n", "  const base = tarefas\n")

          start = "<div style={{ display:'flex', gap:8, borderBottom:'1px solid var(--border)', marginBottom:20 }}>{[{ id:'minhas', label:'Minhas tarefas', icon:ListTodo }, ...(isAdmin ? [{ id:'equipe', label:'Tarefas da equipe', icon:Users }] : [])].map(item => { const Icon=item.icon; const ativo=aba===item.id; return <button key={item.id} onClick={() => setAba(item.id)} style={{ border:'none', borderBottom:`2px solid ${ativo ? 'var(--accent)' : 'transparent'}`, background:'transparent', color:ativo ? 'var(--accent)' : 'var(--text-muted)', padding:'10px 14px', cursor:'pointer', fontWeight:ativo ? 700 : 500, display:'flex', alignItems:'center', gap:7 }}><Icon size={15}/>{item.label}</button> })}</div>"
          if start not in text:
              raise SystemExit('Bloco de abas não encontrado')
          text = text.replace(start, "", 1)
          text = text.replace("{aba === 'equipe' && <select", "{isAdmin && <select", 1)

          path.write_text(text, encoding='utf-8')
          PY

      - name: Instalar dependências
        run: npm install --no-audit --no-fund

      - name: Validar build
        run: npm run build

      - name: Publicar alteração
        run: |
          rm .github/workflows/remove-minhas-tarefas-influencers.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/TarefasInfluencersOrganizadas.js .github/workflows/remove-minhas-tarefas-influencers.yml
          git commit -m "Remove aba Minhas tarefas dos influencers"
          git push origin main
