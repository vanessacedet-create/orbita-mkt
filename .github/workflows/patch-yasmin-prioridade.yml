name: Publicar edição Yasmin e prioridade influencers

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-yasmin-prioridade.yml'
      - '.github/scripts/patch-yasmin-prioridade.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Aplicar alterações
        run: python3 .github/scripts/patch-yasmin-prioridade.py

      - name: Instalar dependências
        run: npm install --no-audit --no-fund

      - name: Validar build
        run: npm run build

      - name: Publicar na main
        run: |
          rm .github/workflows/patch-yasmin-prioridade.yml
          rm .github/scripts/patch-yasmin-prioridade.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/TarefasInfluencersOrganizadas.js .github/workflows/patch-yasmin-prioridade.yml .github/scripts/patch-yasmin-prioridade.py
          git commit -m "feat: permite estagiaria editar e adiciona prioridade nas tarefas influencers"
          git push origin main
