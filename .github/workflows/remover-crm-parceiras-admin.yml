name: Remover CRM Parceiras da visao admin

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/remover-crm-parceiras-admin.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Remover apenas da visualizacao do administrador
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/App.js')
          s = p.read_text(encoding='utf-8')
          marker = 'const ADMIN_MENU_GRUPOS = ['
          if marker not in s:
              raise SystemExit('ADMIN_MENU_GRUPOS nao encontrado')
          before, after = s.split(marker, 1)
          alvo = "      { path: '/crm-parceiras', label: 'Parceiras' },\n"
          if alvo not in after:
              raise SystemExit('CRM Parceiras nao encontrado no menu admin')
          after = after.replace(alvo, '', 1)
          p.write_text(before + marker + after, encoding='utf-8')
          PY

      - name: Verificar escopo
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s = Path('src/App.js').read_text(encoding='utf-8')
          admin = s.split('const ADMIN_MENU_GRUPOS = [', 1)[1]
          assert "{ path: '/crm-parceiras', label: 'Parceiras' }" not in admin
          assert "{ path: '/crm-parceiras', label: 'CRM Parceiras'" in s
          PY

      - name: Instalar dependencias
        run: npm install --no-audit --no-fund

      - name: Validar build
        run: npm run build

      - name: Publicar na main
        run: |
          rm .github/workflows/remover-crm-parceiras-admin.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.js .github/workflows/remover-crm-parceiras-admin.yml
          git commit -m "chore: remove CRM Parceiras da visualizacao admin"
          git push origin main
